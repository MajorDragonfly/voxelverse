name: Player progression UI

on:
  push:
    branches: ["agent/player-progression-ui", "agent/creature-behavior-gameplay", "agent/species-development-path", "agent/tribal-age"]
  pull_request:
    paths:
      - "ui/**"
      - "tests/behavior_skill_tree_test.gd"
      - "tests/creature_behavior_gameplay_test.gd"
      - "tests/development_path_test.gd"
      - "tests/tribal_age*.gd"
      - "world/tribe/**"
      - "world/home_group/**"
      - "tests/fixtures/home_group_pr20.json"
      - "core/progression/**"
      - "autoload/progression_service.gd"
      - "creatures/behavior/**"
      - "tools/review_player_progression.py"
      - "tools/review_behavior_gameplay.gd"
      - ".github/workflows/player-progression-ui.yml"

jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer and Godot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          echo 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  /tmp/godot.zip' | sha256sum -c
          unzip -q /tmp/godot.zip -d /tmp/progression-godot
          chmod +x /tmp/progression-godot/Godot_v4.6.3-stable_linux.x86_64
      - name: Import and validate progression contracts
        run: >-
          python3 tools/validate_godot.py
          --godot /tmp/progression-godot/Godot_v4.6.3-stable_linux.x86_64
          --tests behavior_progression_test behavior_skill_tree_test creature_behavior_gameplay_test development_path_test meta_runtime_test
          --skip-main --output /tmp/player-progression-functional
      - name: Exercise and capture actual GUI
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24'
          python3 tools/review_player_progression.py
          --godot /tmp/progression-godot/Godot_v4.6.3-stable_linux.x86_64
          --output /tmp/player-progression-review
      - name: Exercise real social gameplay and earned purchases
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24'
          python3 tools/review_player_progression.py
          --godot /tmp/progression-godot/Godot_v4.6.3-stable_linux.x86_64
          --gameplay --output /tmp/creature-behavior-review
      - name: Exercise development path and separate phase wallets
        run: >-
          xvfb-run -a -s '-screen 0 1920x1080x24'
          python3 tools/review_player_progression.py
          --godot /tmp/progression-godot/Godot_v4.6.3-stable_linux.x86_64
          --development --output /tmp/development-path-review
      - name: Exercise confirmed transition and village commands
        run: >-
          xvfb-run -a -s '-screen 0 1920x1200x24'
          python3 tools/review_player_progression.py
          --godot /tmp/progression-godot/Godot_v4.6.3-stable_linux.x86_64
          --tribe --output /tmp/tribal-age-review
      - name: Exercise renewable village supply and saved meal detours
        run: >-
          xvfb-run -a -s '-screen 0 1920x1200x24'
          python3 tools/review_player_progression.py
          --godot /tmp/progression-godot/Godot_v4.6.3-stable_linux.x86_64
          --supply --output /tmp/tribal-supply-review
      - name: Exercise village on actual generated terrain
        run: >-
          xvfb-run -a -s '-screen 0 1920x1200x24'
          python3 tools/review_player_progression.py
          --godot /tmp/progression-godot/Godot_v4.6.3-stable_linux.x86_64
          --tribe-world --output /tmp/tribal-world-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-progression-ui-${{ github.event_name }}
          path: |
            /tmp/player-progression-review
            /tmp/player-progression-functional
            /tmp/creature-behavior-review
            /tmp/development-path-review
            /tmp/tribal-age-review
            /tmp/tribal-world-review
            /tmp/tribal-supply-review
          retention-days: 14
