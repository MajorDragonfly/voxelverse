name: Publish sphere corrections 2026-09-11
on:
  push:
    branches: [agent/integration-sphere-acceptance-2026-09-11]
    paths: [.github/workflows/apply-sphere-corrections-20260911.yml]
permissions:
  contents: write
concurrency:
  group: apply-sphere-corrections-20260911
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/integration-sphere-acceptance-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed corrections only to this integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Voxelverse Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          BASE = '313b1d332419b29726dc79970fd3a427cd5b4a48'
          subprocess.run(['git','merge-base','--is-ancestor',BASE,'HEAD'],check=True)
          def edit(path, old, new):
              p=Path(path)
              original=subprocess.check_output(['git','show',BASE+':'+path],text=True)
              # Each edit requires an exact known hunk, never a fuzzy overwrite.
              text=p.read_text(encoding='utf-8')
              if text.count(old)!=1:
                  raise RuntimeError('Unexpected input for '+path)
              p.write_text(text.replace(old,new),encoding='utf-8')
          edit('core/persistence/atomic_json.gd','\treturn JSON.stringify(value, indent, true, true)', '''\tvar frozen: Dictionary = {}
          \t_collect_frozen_blueprints(value, frozen)
          \tif frozen.is_empty(): return JSON.stringify(value, indent, true, true)
          \t# Schema-1 body evidence hashes the released shortened JSON representation
          \t# of frozen local anatomy. Preserve those exact subtrees, not new global
          \t# coordinates. Escaped design/source strings cannot match object text.
          \tvar text: String = JSON.stringify(value, "", true, true)
          \tvar encoded: Array = frozen.keys()
          \tencoded.sort_custom(func(a: String, b: String) -> bool: return a.length() > b.length())
          \tfor precise: String in encoded: text = text.replace(precise, frozen[precise])
          \treturn text

          static func _collect_frozen_blueprints(value: Variant, frozen: Dictionary) -> void:
          \tif value is Dictionary:
          \t\tvar proof: Variant = value.get("body_evidence")
          \t\tvar blueprint: Variant = value.get("blueprint")
          \t\tif proof is Dictionary and proof.get("schema") == 1 and proof.get("source_sha256") is String \\
          \t\t\tand blueprint is Dictionary and blueprint.get("body") is Dictionary and blueprint.get("parts") is Array:
          \t\t\tvar precise: String = JSON.stringify(blueprint, "", true, true)
          \t\t\tfrozen[precise] = JSON.stringify(blueprint, "", true, false)
          \t\tfor child in value.values(): _collect_frozen_blueprints(child, frozen)
          \telif value is Array:
          \t\tfor child in value: _collect_frozen_blueprints(child, frozen)
          ''')
          edit('autoload/save_game_service.gd','\tvar previous: Dictionary = _read_save(target_path)', '''\t# Validate what the reader will actually see BEFORE any live file moves.
          \tvar readback: Dictionary = Atomic.parse_dictionary(Atomic.stringify(save_data))
          \tvar readback_problem: String = _validate_save(readback)
          \tif not readback_problem.is_empty():
          \t\t_report_failure("Serialized save failed validation; previous snapshot retained: " + readback_problem)
          \t\treturn false
          \tvar previous: Dictionary = _read_save(target_path)''')
          edit('autoload/save_game_service.gd','\tif not _validate_save(data).is_empty():\n\t\tsource_path = target_path + ".bak"','\tvar primary_problem: String = _validate_save(data)\n\tif not primary_problem.is_empty():\n\t\tsource_path = target_path + ".bak"')
          edit('autoload/save_game_service.gd','_report_failure("No valid campaign snapshot or backup: " + target_path)','_report_failure("No valid campaign snapshot or backup: " + target_path + " · Primary: " + primary_problem + " · Backup: " + _validate_save(data))')
          edit('assembly/exchange/creature_blueprint_package.gd','\t\tif old.package != JSON.parse_string(JSON.stringify(package)): return _fail("destination_conflict")','''\t\t# Existing immutable exports may use either released number encoding.
          \t\tvar precise: Dictionary = Atomic.parse_dictionary(Atomic.stringify(package))
          \t\tvar legacy: Dictionary = JSON.parse_string(JSON.stringify(package))
          \t\tif old.package != precise and old.package != legacy: return _fail("destination_conflict")''')
          edit('world/surface/gameplay_space.gd','\tif landing.get_normal().dot(actor.up_direction) < cos(actor.floor_max_angle): return false','''\tif landing.get_normal().dot(actor.up_direction) < cos(actor.floor_max_angle):
          \t\t# A rounded capsule edge contact need not have the supporting top normal.
          \t\tif not _walkable_step_top(actor, motion, landing.get_position(), height, probe): return false''')
          edit('world/surface/gameplay_space.gd','static func visual_data(root:', '''static func _walkable_step_top(actor: CharacterBody3D, motion: Vector3, contact: Vector3, height: float, probe: float) -> bool:
          \tvar up_vector: Vector3 = actor.up_direction
          \tvar edge: Vector3 = contact + motion.normalized() * minf(probe, motion.length())
          \tvar lateral: Vector3 = (edge - actor.global_position).slide(up_vector)
          \tvar from: Vector3 = actor.global_position + lateral + up_vector * (height + probe)
          \tvar to: Vector3 = actor.global_position + lateral - up_vector * probe
          \tvar ray := PhysicsRayQueryParameters3D.create(from, to, actor.collision_mask)
          \tray.exclude = [actor.get_rid()]
          \tvar hit: Dictionary = actor.get_world_3d().direct_space_state.intersect_ray(ray)
          \tif hit.is_empty() or hit.normal.dot(up_vector) < cos(actor.floor_max_angle): return false
          \tvar rise: float = (hit.position - actor.global_position).dot(up_vector)
          \treturn rise > actor.safe_margin and rise <= height

          static func visual_data(root:''')
          paths=['tests/community_blueprint_package_test.gd','tests/creature_design_library_test.gd','tests/creature_behavior_gameplay_test.gd','tests/campaign_foundation_test.gd','tests/tribal_age_economy_test.gd','tests/tribal_age_supply_test.gd','tests/tribal_age_growth_test.gd','tests/tribal_age_husbandry_test.gd','tests/domestic_surface_runtime_test.gd','tools/domestic_fauna_restart_probe.gd','tools/domestic_fauna_d11_restart_probe.gd','tools/domestic_fauna_d12_restart_probe.gd','tests/phase_handoff_test.gd']
          for path in paths:
              p=Path(path); text=p.read_text(encoding='utf-8')
              assert 'JSON.parse_string(JSON.stringify(' in text,path
              text=text.replace('JSON.parse_string(JSON.stringify(', 'JSON.parse_string(Atomic.stringify(')
              if 'const Atomic =' not in text:
                  text=text.replace('\n','\nconst Atomic = preload("res://core/persistence/atomic_json.gd")\n',1)
              p.write_text(text,encoding='utf-8')
          p=Path('tests/research_goals_test.gd'); text=p.read_text(encoding='utf-8'); text=text.replace('Atomic.parse_dictionary(JSON.stringify(', 'Atomic.parse_dictionary(Atomic.stringify('); p.write_text(text,encoding='utf-8')
          p=Path('tests/far_simulation_test.gd'); text=p.read_text(encoding='utf-8')
          text=text.replace('\n','\nconst Atomic = preload("res://core/persistence/atomic_json.gd")\n',1)
          text=text.replace('\t_expect(saves.save_now(), "Far owner/cargo/stock did not commit together:', '\tvar stored_before: Dictionary = Atomic.parse_dictionary(Atomic.stringify(state.export_state()))\n\t_expect(saves.save_now(), "Far owner/cargo/stock did not commit together:')
          text=text.replace('Migration.fingerprint(state.export_state()) == before, "Reload replayed work','Migration.fingerprint(state.export_state()) == Migration.fingerprint(stored_before), "Reload replayed work')
          p.write_text(text,encoding='utf-8')
          edit('tests/spherical_developed_migration_test.gd','Migration.inventory(source) == Migration.inventory(result)','Migration.inventory(Atomic.parse_dictionary(original)) == Migration.inventory(result)')
          edit('core/diagnostics/spherical_gameplay_probe.gd','\tawait _open(path, true)\n\t_expect(Migration.fingerprint(state.get_current_body().tribe)', '''\tawait _open(path, true)
          \tif not _expect_world(): await _finish(); return
          \tif not _expect_step(state.get_current_body().get("tribe") is Dictionary, "Reload lost the saved tribe: " + saves.last_error):
          \t\tawait _finish()
          \t\treturn
          \t_expect(Migration.fingerprint(state.get_current_body().tribe)''')
          p=Path('tools/validation/contracts.json'); data=json.loads(p.read_text(encoding='utf-8'))
          for owner,name in [('campaign','frozen_body_serialization_test'),('surface','radial_step_test')]:
              contract=next(x for x in data['contracts'] if x['id']==owner)
              assert name not in contract['tests']
              contract['tests'].append(name)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','-u'],check=True)
          subprocess.run(['git','commit','-m','Fix frozen-body JSON save continuity and radial capsule step contacts'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/agent/integration-sphere-acceptance-2026-09-11'],check=True)
          print('CORRECTED_COMMIT',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('CORRECTED_TREE',subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip())
          PY
      - uses: ./.github/actions/setup-godot-editor
        id: engine
      - name: Validate recovered correction and affected continuity
        run: >-
          python tools/validate_godot.py --godot "${{ steps.engine.outputs.godot }}"
          --skip-main --output "${{ runner.temp }}/correction-checks"
          --tests frozen_body_serialization_test radial_step_test coordinate_persistence_test
          save_participants_test phase_handoff_test far_simulation_test frontend_test
          domestication_world_test wildlife_ai_world_test home_group_world_test
          spherical_campaign_runtime_test spherical_developed_migration_test
          domestic_surface_runtime_test tribal_age_economy_test tribal_age_supply_test
          tribal_age_growth_test tribal_age_husbandry_test
      - name: Repeat all D1 process-boundary probes
        run: |
          python tools/validate_domestic_fauna.py --godot "${{ steps.engine.outputs.godot }}" --output "${{ runner.temp }}/d1-restart"
          python tools/validate_domestic_fauna.py --godot "${{ steps.engine.outputs.godot }}" --probe d11 --output "${{ runner.temp }}/d11-restart"
          python tools/validate_domestic_fauna.py --godot "${{ steps.engine.outputs.godot }}" --probe d12 --output "${{ runner.temp }}/d12-restart"
      - name: Archive exact source for independent review
        if: always()
        run: |
          mkdir -p "${{ runner.temp }}/correction-source"
          git bundle create "${{ runner.temp }}/correction-source/source.bundle" HEAD
          git rev-parse HEAD > "${{ runner.temp }}/correction-source/commit.txt"
          git diff --binary HEAD > "${{ runner.temp }}/correction-source/uncommitted.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sphere-corrections-source-and-checks
          path: |
            ${{ runner.temp }}/correction-source
            ${{ runner.temp }}/correction-checks
            ${{ runner.temp }}/d1-restart
            ${{ runner.temp }}/d11-restart
            ${{ runner.temp }}/d12-restart
          retention-days: 14
