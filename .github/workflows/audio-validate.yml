name: Audio validation

on:
  push:
    branches: ["agent/audio-foundation"]
  pull_request:
    paths: ["audio/**", "tests/audio/**", "tools/audio/**", "project.godot", ".github/workflows/audio-validate.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      XDG_DATA_HOME: /tmp/voxelverse-audio-test-user
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot-editor
        id: engine
      - name: Inspect committed foley signals
        run: |
          python3 -m pip install numpy==2.3.5
          python3 tools/audio/check_foley.py --output /tmp/audio-foley-signals.json
      - name: Keep audio user-data isolation
        run: |
          # Only archives are cached. These direct probes must honor XDG_DATA_HOME.
          rm "$(dirname '${{ steps.engine.outputs.godot }}')/_sc_"
      - name: Import a fresh checkout
        run: |
          set -o pipefail
          "${{ steps.engine.outputs.godot }}" --headless --path . --editor --import 2>&1 | tee /tmp/audio-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|Failed to create an autoload' /tmp/audio-import.log
      - name: Run audio physics and settings tests
        run: |
          set -o pipefail
          timeout 70s "${{ steps.engine.outputs.godot }}" --headless --path . --script res://tests/audio/audio_runtime_test.gd 2>&1 | tee /tmp/audio-runtime.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/audio-runtime.log
      - name: Run creature voices and event integration tests
        run: |
          set -o pipefail
          timeout 70s "${{ steps.engine.outputs.godot }}" --headless --path . --script res://tests/audio/creature_audio_test.gd 2>&1 | tee /tmp/audio-creatures.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/audio-creatures.log
      - name: Run music playback and transition tests
        run: |
          set -o pipefail
          timeout 70s "${{ steps.engine.outputs.godot }}" --headless --path . --script res://tests/audio/music_runtime_test.gd 2>&1 | tee /tmp/audio-music.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/audio-music.log
      - name: Run occlusion, action and music cadence tests
        run: |
          set -o pipefail
          timeout 90s "${{ steps.engine.outputs.godot }}" --headless --path . --script res://tests/audio/audio_expansion_test.gd 2>&1 | tee /tmp/audio-expansion.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/audio-expansion.log
      - name: Run scanner, group feedback and comfort DSP tests
        run: |
          set -o pipefail
          timeout 70s "${{ steps.engine.outputs.godot }}" --headless --path . --script res://tests/audio/interface_audio_test.gd 2>&1 | tee /tmp/audio-interface.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/audio-interface.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-validation-logs
          path: /tmp/audio-*.log
          retention-days: 7
