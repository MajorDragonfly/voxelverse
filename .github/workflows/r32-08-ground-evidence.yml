name: R32-08 fixed ground evidence
on:
  push:
    branches: [agent/r32-08-evidence-20261002]
    paths: [.github/workflows/r32-08-ground-evidence.yml]
permissions:
  contents: read
concurrency:
  group: r32-08-ground-evidence
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        category: [campaign_spawn, grassland, desert, rocky_highlands, snow, coast]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d423003ddf2f369c652d53552a8068f85e9bad46
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-godot-editor
        id: engine
      - name: Install native software renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth mesa-vulkan-drivers libgl1-mesa-dri
      - name: Focused active-surface contract
        run: |
          python tools/validate_godot.py --godot "${{ steps.engine.outputs.godot }}" --tests living_surface_materials_test --skip-main --output "${{ runner.temp }}/r32-08/focused"
      - name: Shader-only edge probe
        if: matrix.category == 'campaign_spawn'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          ICD="$(python -c 'from pathlib import Path; p=sorted(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json")); assert len(p)==1,p; print(p[0])')"
          python tools/review_r32_08_ground.py --godot "${{ steps.engine.outputs.godot }}" --renderer "forward_plus" --mode probe --xvfb /usr/bin/Xvfb --vulkan-icd "$ICD" --output "${{ runner.temp }}/r32-08/probe"
      - name: Regular campaign ground comparison
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          ICD="$(python -c 'from pathlib import Path; p=sorted(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json")); assert len(p)==1,p; print(p[0])')"
          python tools/review_r32_08_ground.py --godot "${{ steps.engine.outputs.godot }}" --renderer "forward_plus" --mode campaign --category "${{ matrix.category }}" --xvfb /usr/bin/Xvfb --vulkan-icd "$ICD" --output "${{ runner.temp }}/r32-08/campaign"
      - name: Upload original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-08-ground-forward_plus-${{ matrix.category }}
          path: ${{ runner.temp }}/r32-08
          retention-days: 14
