name: Publish reviewed Windows acceptance fixes
on:
  push:
    branches: [agent/integration-sphere-acceptance-2026-09-11]
    paths: [.github/workflows/publish-windows-fixture-fix.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply exact checked hunks, verify output blobs, remove this one-shot publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Voxelverse Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          BASE='bda7f471b19308b275b14e39f55d3b86d6bed0bb'
          subprocess.run(['git','merge-base','--is-ancestor',BASE,'HEAD'],check=True)
          paths={
              '.github/workflows/export-validate.yml':'7bf0fb6c15670296fabcd7f2f9c43c62fc5c010a',
              '.github/workflows/godot-validate.yml':'2e7156846b739cf64ff121f0064667eee73deb44',
              'core/diagnostics/spherical_gameplay_probe.gd':'bdd34740a3d34c7e58e88926ba0b53ea44c6e0eb',
              'tools/validate_export.py':'48c54a35a4ee1bf3db355f9cf1b20c7bcc3b0211',
          }
          for path in paths:
              if Path(path).read_bytes()!=subprocess.check_output(['git','show',BASE+':'+path]):
                  raise RuntimeError('Unreviewed input changed: '+path)
          def edit(path,old,new,count=1):
              p=Path(path);text=p.read_text(encoding='utf-8')
              if text.count(old)!=count: raise RuntimeError('Expected hunk missing: '+path)
              p.write_text(text.replace(old,new),encoding='utf-8')
          probe='core/diagnostics/spherical_gameplay_probe.gd'
          edit(probe,'\t_expect(owned.size() == 1 and owned[0].location.contains("Breite"), "Shared campaign book lost the original spherical production animal.")','''\t# Identity and the canonical address are invariant; a German word is not.
          \t# The same real journal must also pass on an English Windows installation.
          \tvar listed: Dictionary = owned[0].get("_display_data", {}) if owned.size() == 1 else {}
          \tvar listed_place: Variant = listed.get("position")
          \tvar correct_place: bool = listed_place is Dictionary and listed_place.get("body_id") == state.get_current_body().id
          \tif correct_place:
          \t\tcorrect_place = Home.distance(listed_place, runtime.controller.record(id).position) < 0.005
          \tvar location_text: String = preload("res://ui/discovery/owned_animal_presentation.gd").point(listed_place) if correct_place else ""
          \t_expect(owned.size() == 1 and listed.get("key") == id and listed.get("species_id") == species_id
          \t\tand correct_place and owned[0].location.ends_with(location_text), "Shared campaign book lost the original spherical production animal/address: " + str(owned))''')
          edit(probe,'\ttree.current_scene.add_child(blocker)\n\t# Block the route ahead. Spawning a solid box around the carrier can eject\n\t# it underneath the floor, which is not a reachable-path obstruction.','\t# Stage a route obstruction outside every live capsule. An intersecting\n\t# wall can push the nearby production animal outside its pen while it is\n\t# still within the legitimate 0.5 m tolerance of its wait target.')
          edit(probe,'\tblocker.global_transform = Transform3D(Space.frame(self, carrier_position, direction), carrier_position + direction * 0.9 + up)','''\tvar query := PhysicsShapeQueryParameters3D.new()
          \tquery.shape = box
          \tquery.collision_mask = 4 | 8 # Existing animals, villagers and player; not ground.
          \tquery.margin = 0.1
          \tvar placed: bool = false
          \tfor distance in [0.9, 1.3, 1.7, 2.1, 2.5, 2.9]:
          \t\tquery.transform = Transform3D(Space.frame(self, carrier_position, direction), carrier_position + direction * distance + up)
          \t\tvar occupants: Array[Dictionary] = tribe.actors[carrier].get_world_3d().direct_space_state.intersect_shape(query, 32)
          \t\tif not occupants.is_empty(): continue
          \t\ttree.current_scene.add_child(blocker)
          \t\tblocker.global_transform = query.transform
          \t\tplaced = true
          \t\tprint("SPHERE_CARRIER_OBSTACLE ", {"distance": distance, "overlapping_actors": occupants.size()})
          \t\tbreak
          \tif not placed:
          \t\tblocker.free()
          \t\t_expect(false, "No collision-free obstruction for the actual loaded carrier.")
          \t\treturn''')
          edit(probe,'\t# The real carrier obstacle can also push the nearby animal. Let its\n\t# existing wait order restore physical pen attendance before departure.','\t# Keep the actual pen attendance requirement after removing the wall;\n\t# neither the animal nor its wait target is moved by the probe.')
          export='tools/validate_export.py'
          edit(export,'from validate_godot import ERROR','from validate_godot import ERROR\nfrom check_validation_contracts import revision')
          edit(export,'summary = {"godot": version, "platform": args.platform, "checks": results, "probes": []}','summary = {"godot": version, "platform": args.platform, "source": revision(args.project),\n               "checks": results, "probes": []}')
          edit(export,'            # Official 4.6.3 release templates disable --script. Keep that intact:','''            run("packaged_spherical_egg_production", [str(executable), "--headless", "--verbose", "--",
                                                                 "--sphere-gameplay-smoke", "--egg-production"],
                          package, isolated_env(root / "egg-production-userdata"), timeout=900)
                      if "SPHERICAL_EGG_PRODUCTION_PASSED" not in (logs / "packaged_spherical_egg_production.log").read_text():
                          raise RuntimeError("Native executable did not complete real egg transport, meal and restart acceptance.")
                      # Official 4.6.3 release templates disable --script. Keep that intact:'''.replace('\n          ','\n'))
          edit(export,'            archive_path = args.output / f"voxelverse-{args.platform}-x86_64.zip"','''            (package / "BUILD_INFO.json").write_text(json.dumps({
                          "source": summary["source"], "godot": version, "platform": args.platform,
                          "acceptance": "native_headless_release_and_exact_pck", "checks_passed": len(results),
                          "target_pc_acceptance": False}, indent=2) + "\\n", encoding="utf-8")
                      archive_path = args.output / f"voxelverse-{args.platform}-x86_64.zip"'''.replace('\n          ','\n'))
          edit('.github/workflows/export-validate.yml','timeout_minutes: 30','timeout_minutes: 40',2)
          edit('.github/workflows/export-validate.yml','# The complete 37-check campaign suite exceeds 20 minutes on both runners.','# Full release acceptance now includes both real milk and egg production trips.\n    # Each runs production, blocked freight, A-B-A and fresh processes; no checks skipped.')
          edit('.github/workflows/godot-validate.yml','    timeout-minutes: 20\n    strategy:','    # Two shards include full production/travel chains; retain per-test deadlines.\n    timeout-minutes: 30\n    strategy:')
          for path,expected in paths.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if actual!=expected: raise RuntimeError('Exact local/remote file mismatch: '+path+' '+actual)
          Path('.github/workflows/publish-windows-fixture-fix.yml').unlink()
          subprocess.run(['python3','-m','py_compile','tools/validate_export.py'],check=True)
          subprocess.run(['python3','tools/check_validation_contracts.py'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','-u'],check=True)
          subprocess.run(['git','commit','-m','Fix locale-independent journal and non-overlapping carrier obstruction; require native egg chain'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/agent/integration-sphere-acceptance-2026-09-11'],check=True)
          print('PUBLISHED_COMMIT',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('PUBLISHED_TREE',subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip())
          PY
