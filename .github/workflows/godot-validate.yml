name: Godot validation

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

# Keep branch checks and PR merge checks independent; replace only older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check contract registration and generated translations
        run: python3 tools/check_validation_contracts.py --output /tmp/validation-contracts/contracts.json
      - name: Check validation failure paths
        run: python3 -m unittest discover -s tests/tooling -p '*_test.py'
      - name: Upload source contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelverse-validate-contracts-${{ github.event_name }}
          path: /tmp/validation-contracts
          retention-days: 7

  source:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot-editor
        id: engine
      - name: Import and run disjoint headless Godot checks
        env:
          GODOT_BINARY: ${{ steps.engine.outputs.godot }}
          VALIDATION_SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          from tools.validate_godot import main
          from tools.check_validation_contracts import discover_tests

          tests = discover_tests(Path.cwd())
          shard = int(os.environ["VALIDATION_SHARD"])
          selected = tests[shard::4]
          assert selected, "Source shard unexpectedly contains no tests"
          print(f"Source shard {shard}: {len(selected)} of {len(tests)} tests", flush=True)
          sys.argv = ["validate_godot", "--godot", os.environ["GODOT_BINARY"],
                      "--skip-main", "--output", "/tmp/validation-validate",
                      "--tests", *selected]
          raise SystemExit(main())
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelverse-validate-source-${{ matrix.shard }}-${{ github.event_name }}
          path: /tmp/validation-validate
          retention-days: 7

  runtime:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot-editor
        id: engine
      - name: Import and check actual entries, shutdown and streaming
        run: >-
          python3 tools/validate_godot.py
          --godot "${{ steps.engine.outputs.godot }}"
          --tests
          --output /tmp/validation-runtime
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelverse-validate-runtime-${{ github.event_name }}
          path: /tmp/validation-runtime
          retention-days: 7

  validate:
    needs: [contracts, source, runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require contracts, every headless shard and runtime checks
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          test "$CONTRACTS_RESULT" = success
          test "$SOURCE_RESULT" = success
          test "$RUNTIME_RESULT" = success
