name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

# Validate PR merge trees once; keep main and manual checks independently cancellable.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      source: ${{ steps.plan.outputs.source }}
      runtime: ${{ steps.plan.outputs.runtime }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/plan-validation
        id: plan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check contract registration and generated translations
        run: python3 tools/check_validation_contracts.py --output /tmp/validation-contracts/contracts.json
      - name: Check bounded work briefs
        run: python3 tools/work_packet.py check
      - name: Check project hygiene
        run: python3 tools/check_project_hygiene.py
      - name: Check validation failure paths
        run: python3 -m unittest discover -s tests/tooling -p '*_test.py'
      - name: Upload source contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelverse-validate-contracts-${{ github.event_name }}
          path: /tmp/validation-contracts
          retention-days: 7

  source:
    needs: contracts
    if: needs.contracts.outputs.source == 'true'
    runs-on: ubuntu-latest
    # Real production/travel checks exceeded the old 30-minute shard envelope.
    # Preserve their individual deadlines and every test; allow the full shard.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contracts.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot-editor
        id: engine
      - name: Import and run disjoint headless Godot checks
        env:
          GODOT_BINARY: ${{ steps.engine.outputs.godot }}
          VALIDATION_SHARD: ${{ matrix.shard }}
          VALIDATION_TESTS: ${{ toJSON(matrix.tests) }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import sys
          from tools.validate_godot import main

          shard = int(os.environ["VALIDATION_SHARD"])
          selected = json.loads(os.environ["VALIDATION_TESTS"])
          assert selected, "Source shard unexpectedly contains no tests"
          print(f"Source shard {shard}: {len(selected)} planned tests", flush=True)
          sys.argv = ["validate_godot", "--godot", os.environ["GODOT_BINARY"],
                      "--skip-main", "--output", "/tmp/validation-validate",
                      "--tests", *selected]
          raise SystemExit(main())
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelverse-validate-source-${{ matrix.shard }}-${{ github.event_name }}
          path: /tmp/validation-validate
          retention-days: 7

  runtime:
    needs: contracts
    if: needs.contracts.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot-editor
        id: engine
      - name: Import and check actual entries, shutdown and streaming
        run: >-
          python3 tools/validate_godot.py
          --godot "${{ steps.engine.outputs.godot }}"
          --tests
          --output /tmp/validation-runtime
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelverse-validate-runtime-${{ github.event_name }}
          path: /tmp/validation-runtime
          retention-days: 7

  validate:
    name: ${{ needs.contracts.outputs.mode == 'draft' && 'Godot draft feedback' || 'Godot validation gate' }}
    needs: [contracts, source, runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require contracts, every headless shard and runtime checks
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          SOURCE_REQUIRED: ${{ needs.contracts.outputs.source }}
          RUNTIME_REQUIRED: ${{ needs.contracts.outputs.runtime }}
        run: |
          test "$CONTRACTS_RESULT" = success
          if [ "$SOURCE_REQUIRED" = true ]; then test "$SOURCE_RESULT" = success; else test "$SOURCE_RESULT" = skipped; fi
          if [ "$RUNTIME_REQUIRED" = true ]; then test "$RUNTIME_RESULT" = success; else test "$RUNTIME_RESULT" = skipped; fi
