name: Godot validation

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64

      - name: Import project and detect parser errors
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          "$GODOT" --headless --path . --import \
            2>&1 | tee /tmp/godot-import.log
          ! grep -E \
            "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate an autoload|Shader compilation failed" \
            /tmp/godot-import.log

      - name: Run main scene runtime smoke test
        shell: bash
        run: |
          set +e
          GODOT=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          timeout 55s "$GODOT" --headless --path . --quit-after 300 \
            > /tmp/main-runtime-test.log 2>&1
          TEST_STATUS=$?

          if [ "$TEST_STATUS" -eq 124 ]; then
            echo "Main runtime smoke test timed out after 55 seconds." \
              >> /tmp/main-runtime-test.log
            TEST_STATUS=1
          fi

          if grep -E \
            "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Failed to load script|Failed loading resource|Failed to instantiate an autoload|Shader compilation failed" \
            /tmp/main-runtime-test.log; then
            TEST_STATUS=1
          fi

          cat /tmp/main-runtime-test.log
          exit "$TEST_STATUS"

      - name: Run Creature V5 compatibility test
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          "$GODOT" --headless --path . \
            --script res://tests/creature_v5_smoke_test.gd

      - name: Run Creature Builder V7 test
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          "$GODOT" --headless --path . \
            --script res://tests/creature_builder_v7_test.gd \
            2>&1 | tee /tmp/creature-builder-v7-test.log

      - name: Run World Evolution V2 compatibility test
        shell: bash
        run: |
          set +e
          GODOT=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          timeout 90s "$GODOT" --headless --path . \
            --script res://tests/world_evolution_v2_ci_test.gd \
            > /tmp/world-evolution-test.log 2>&1
          TEST_STATUS=$?

          if [ "$TEST_STATUS" -eq 124 ]; then
            echo "World Evolution V2 smoke test timed out after 90 seconds." \
              >> /tmp/world-evolution-test.log
          fi

          if grep -E \
            "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate an autoload" \
            /tmp/world-evolution-test.log; then
            TEST_STATUS=1
          fi

          grep -E \
            "World Evolution|World sample|World test stage|ERROR|SCRIPT ERROR|Parse Error|failed|outside|invalid|lacks|fewer|seed|timed out" \
            /tmp/world-evolution-test.log || cat /tmp/world-evolution-test.log

          exit "$TEST_STATUS"

      - name: Run World Runtime V6 compatibility test
        shell: bash
        run: |
          set +e
          GODOT=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          timeout 90s "$GODOT" --headless --path . \
            --script res://tests/world_runtime_v6_test.gd \
            > /tmp/world-runtime-v6-test.log 2>&1
          TEST_STATUS=$?

          if [ "$TEST_STATUS" -eq 124 ]; then
            echo "World Runtime V6 test timed out after 90 seconds." \
              >> /tmp/world-runtime-v6-test.log
          fi

          if grep -E \
            "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate an autoload|Shader compilation failed" \
            /tmp/world-runtime-v6-test.log; then
            TEST_STATUS=1
          fi

          cat /tmp/world-runtime-v6-test.log
          exit "$TEST_STATUS"

      - name: Run Layered World V7 test
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          "$GODOT" --headless --path . \
            --script res://tests/world_layered_v7_test.gd \
            2>&1 | tee /tmp/world-layered-v7-test.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelverse-validation-diagnostics
          path: |
            /tmp/main-runtime-test.log
            /tmp/creature-builder-v7-test.log
            /tmp/world-evolution-test.log
            /tmp/world-runtime-v6-test.log
            /tmp/world-layered-v7-test.log
          if-no-files-found: warn
          retention-days: 3
