name: Godot validation

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

# Keep branch checks and PR merge checks independent; replace only older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot-editor
        id: engine
      - name: Import and run real runtime acceptance checks
        run: >-
          python3 tools/validate_godot.py
          --godot "${{ steps.engine.outputs.godot }}"
          --output /tmp/validation-validate
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelverse-validate-${{ github.event_name }}
          path: /tmp/validation-validate
          retention-days: 7
