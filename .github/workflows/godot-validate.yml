name: Godot validation

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

# Keep branch checks and PR merge checks independent; replace only older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot-editor
        id: engine
      - name: Import and run disjoint source acceptance checks
        env:
          GODOT_BINARY: ${{ steps.engine.outputs.godot }}
          VALIDATION_SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          from tools.validate_godot import main

          tests = sorted(str(path.relative_to("tests").with_suffix(""))
                         for path in Path("tests").rglob("*_test.gd"))
          shard = int(os.environ["VALIDATION_SHARD"])
          selected = tests[shard::4]
          assert selected, "Source shard unexpectedly contains no tests"
          print(f"Source shard {shard}: {len(selected)} of {len(tests)} tests", flush=True)
          sys.argv = ["validate_godot", "--godot", os.environ["GODOT_BINARY"],
                      "--skip-main", "--output", "/tmp/validation-validate",
                      "--tests", *selected]
          raise SystemExit(main())
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelverse-validate-source-${{ matrix.shard }}-${{ github.event_name }}
          path: /tmp/validation-validate
          retention-days: 7

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot-editor
        id: engine
      - name: Import and check actual entries, shutdown and streaming
        run: >-
          python3 tools/validate_godot.py
          --godot "${{ steps.engine.outputs.godot }}"
          --tests
          --output /tmp/validation-runtime
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelverse-validate-runtime-${{ github.event_name }}
          path: /tmp/validation-runtime
          retention-days: 7

  validate:
    needs: [source, runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every source shard and runtime check
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$RUNTIME_RESULT" = success
