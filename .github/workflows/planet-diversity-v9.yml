name: Planet diversity V9

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  diversity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
      - name: Import and run real runtime acceptance checks
        run: >-
          python3 tools/validate_godot.py
          --godot /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          --output /tmp/validation-diversity --tests planet_diversity_v9_test planet_generation_acceptance_test environment_production_test planet_transition_runtime_test --skip-main
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelverse-diversity-${{ github.event_name }}
          path: /tmp/validation-diversity
          retention-days: 7
