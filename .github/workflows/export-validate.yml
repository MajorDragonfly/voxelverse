name: Desktop export validation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-export-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      acceptance: ${{ steps.plan.outputs.acceptance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/plan-validation
        id: plan

  export:
    needs: plan
    if: needs.plan.outputs.acceptance == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            editor: Godot_v4.6.3-stable_linux.x86_64
            timeout_minutes: 60
          - os: windows-latest
            platform: windows
            editor: Godot_v4.6.3-stable_win64_console.exe
            timeout_minutes: 60
    runs-on: ${{ matrix.os }}
    # Full release acceptance now includes both real milk and egg production trips.
    # Each runs production, blocked freight, A-B-A and fresh processes; no checks skipped.
    # Windows needed nearly 40 minutes for those flows before the PCK contract matrix.
    # Individual probe deadlines remain enforced by validate_export.py.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pinned Godot downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/godot-export-toolchain/*.zip
            ${{ runner.temp }}/godot-export-toolchain/*.tpz
          key: godot-desktop-archives-${{ runner.os }}-${{ hashFiles('tools/install_godot.py') }}
      - name: Install verified editor and templates
        run: >-
          python tools/install_godot.py
          --directory "${{ runner.temp }}/godot-export-toolchain"
          --platform ${{ matrix.platform }}
      - name: Export and validate outside the source checkout
        run: >-
          python tools/validate_export.py
          --godot "${{ runner.temp }}/godot-export-toolchain/editor/${{ matrix.editor }}"
          --platform ${{ matrix.platform }}
          --output "${{ runner.temp }}/voxelverse-export"
      - name: Upload accepted desktop build
        uses: actions/upload-artifact@v4
        with:
          name: voxelverse-${{ matrix.platform }}-${{ github.event_name }}
          path: |
            ${{ runner.temp }}/voxelverse-export/*.zip
            ${{ runner.temp }}/voxelverse-export/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-diagnostics-${{ matrix.platform }}-${{ github.event_name }}
          path: |
            ${{ runner.temp }}/voxelverse-export/logs
            ${{ runner.temp }}/voxelverse-export/results.json
          retention-days: 14

  validate:
    name: ${{ needs.plan.outputs.mode == 'draft' && 'Desktop draft plan' || 'Desktop export gate' }}
    needs: [plan, export]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify planned export acceptance
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          REQUIRED: ${{ needs.plan.outputs.acceptance }}
          RESULT: ${{ needs.export.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$REQUIRED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi
