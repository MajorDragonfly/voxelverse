name: Creature studio validation

on:
  push:
    branches: ["agent/creature-editor-spore"]
  pull_request:
    paths: ["creatures/**", "tests/creature_studio_test.gd", "tools/capture_creature_studio.gd"]

concurrency:
  group: creature-studio-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot-editor
        id: engine
      - name: Install software display and keep review user-data isolation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          # This direct review previously used an editor without portable mode.
          rm "$(dirname '${{ steps.engine.outputs.godot }}')/_sc_"
      - name: Import and exercise editor contracts
        run: |
          python tools/validate_godot.py --godot "${{ steps.engine.outputs.godot }}" --tests creature_studio_test creature_parts_studio_test creature_joint_studio_test creature_editor_v7_runtime_test creature_builder_v7_test runtime_geometry_batch_test --skip-main --output /tmp/creature-studio-checks
      - name: Render the real workshop
        if: ${{ !cancelled() }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          XDG_DATA_HOME: /tmp/creature-studio-user
        run: |
          xvfb-run -a -s '-screen 0 1600x900x24' python tools/review_creature_studio.py --godot "${{ steps.engine.outputs.godot }}" --output /tmp/creature-studio-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creature-studio-review-${{ github.event_name }}
          path: |
            /tmp/creature-studio-checks
            /tmp/creature-studio-review
          retention-days: 14
