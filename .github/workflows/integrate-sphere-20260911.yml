name: Sphere integration 2026-09-11

on:
  push:
    branches: [agent/integration-sphere-acceptance-2026-09-11]
    paths: [.github/workflows/integrate-sphere-20260911.yml]

permissions:
  contents: write

concurrency:
  group: sphere-integration-20260911
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/integration-sphere-acceptance-2026-09-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate exact reviewed handoffs without modifying main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Voxelverse Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          BASE = 'bb2f83b56267964baa7037720c4daca26fe3d007'
          SOURCES = [
              (78, 'cff4a6928bbac312ea4849e19b9d47bd3fd9d887', 'ARCH-06'),
              (81, '6693a51d941ccd2dd236db07f78ba736ce9d9534', 'ARCH-07'),
              (83, 'f2b2ee90838719d8dd2fbb619babeb9e1078e938', 'ARCH-22'),
              (79, '034316fcfe1bd4078671582dcd880209a1c8ad3c', 'ARCH-14'),
              (80, '3930b019b9fb3126cf5b0f285f2178c682c83e30', 'ARCH-24'),
              (82, '15c6f1fbd6c1766aeafcffe490050cea78fb5f07', 'ARCH-25'),
          ]
          CENTRAL = {'ROADMAP.md', 'docs/ARCHITECTURE_BACKLOG.md', 'docs/NEXT_PARALLEL_WORK.md'}
          REGISTRY = 'tools/validation/contracts.json'
          def git(*args, check=True):
              return subprocess.run(['git', *args], check=check, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          def text(ref, path):
              return git('show', ref + ':' + path).stdout
          def write(path, content):
              pathlib.Path(path).write_text(content, encoding='utf-8')
              git('add', path)
          def union_registry(left, right):
              a, b = json.loads(left), json.loads(right)
              if a['schema'] != b['schema']:
                  raise RuntimeError('Conflicting validation registry schemas')
              contracts = {entry['id']: entry for entry in a['contracts']}
              for incoming in b['contracts']:
                  key = incoming['id']
                  if key not in contracts:
                      a['contracts'].append(incoming)
                      contracts[key] = incoming
                      continue
                  target = contracts[key]
                  for field in set(target) | set(incoming):
                      if field == 'tests':
                          target[field] = sorted(set(target[field]) | set(incoming[field]))
                      elif target.get(field) != incoming.get(field):
                          raise RuntimeError('Review registry metadata conflict: ' + key + '/' + field)
              owners = {}
              for entry in a['contracts']:
                  for test in entry['tests']:
                      if test in owners:
                          raise RuntimeError('Duplicate test registration: ' + test)
                      owners[test] = entry['id']
              return json.dumps(a, ensure_ascii=False, indent=2) + '\n'

          git('merge-base', '--is-ancestor', BASE, 'HEAD')
          if git('status', '--porcelain').stdout.strip():
              raise RuntimeError('Integration requires a clean checkout')
          git('fetch', 'origin', *['refs/pull/%d/head:refs/integration/pr%d' % (n,n) for n,_,_ in SOURCES])
          for number, sha, package in SOURCES:
              if git('rev-parse', 'refs/integration/pr%d' % number).stdout.strip() != sha:
                  raise RuntimeError('PR head moved; explicit re-review required: %d' % number)
              git('merge-base', '--is-ancestor', BASE, sha)
              if git('merge-base', '--is-ancestor', sha, 'HEAD', check=False).returncode == 0:
                  continue
              previous = git('rev-parse', 'HEAD').stdout.strip()
              result = git('merge', '--no-ff', '--no-commit', sha, check=False)
              print(result.stdout, result.stderr, flush=True)
              conflicts = git('diff', '--name-only', '--diff-filter=U').stdout.splitlines()
              for path in conflicts:
                  if path == REGISTRY:
                      write(path, union_registry(text(previous,path), text(sha,path)))
                  elif path in CENTRAL:
                      # These historical status documents get a single current
                      # integration header below. Individual handoff reports survive.
                      write(path, text(BASE,path))
                  elif path == 'autoload/save_game_service.gd' and number == 83:
                      diff = git('diff', '--unified=0', BASE, sha, '--', path).stdout
                      added = [x[1:] for x in diff.splitlines() if x.startswith('+') and not x.startswith('+++')]
                      removed = [x for x in diff.splitlines() if x.startswith('-') and not x.startswith('---')]
                      expected = '\t\t\tif body is Dictionary and body.get("tribe") is Dictionary and Tribe.Husbandry.has_unsupported_contract(body.tribe.get("husbandry")): return true'
                      if added != [expected] or removed:
                          raise RuntimeError('Unexpected additional ARCH-22 save changes')
                      # ARCH-07 moves this guard to the registered tribe participant.
                      write(path, text(previous,path))
                  else:
                      raise RuntimeError('Unreviewed merge conflict: ' + path)
              if git('diff', '--name-only', '--diff-filter=U').stdout.strip():
                  raise RuntimeError('Unresolved merge conflicts')
              if result.returncode and not conflicts:
                  raise RuntimeError('Merge failed without resolvable conflicts')
              if number == 83:
                  path = 'core/persistence/save_participants.gd'
                  content = pathlib.Path(path).read_text(encoding='utf-8')
                  needle = 'Tribe.Economy.has_unsupported_contract(value.get("economy"))'
                  if content.count(needle) != 1:
                      raise RuntimeError('Unexpected tribe participant implementation')
                  content = content.replace(needle, needle + ' or Tribe.Husbandry.has_unsupported_contract(value.get("husbandry"))')
                  write(path, content)
              git('diff', '--check')
              git('commit', '-m', 'Integrate PR #%d (%s) with preserved source ancestry' % (number,package))

          rows = '\n'.join('| %s | #%d | `%s` |' % (package,number,sha) for number,sha,package in SOURCES)
          report = '''# Voxelverse – Kugelintegration vom 11. September 2026

          Basis: `bb2f83b56267964baa7037720c4daca26fe3d007`.
          Integrationsbranch: `agent/integration-sphere-acceptance-2026-09-11`.
          Dieser Bericht dokumentiert den Quellzusammenbau, noch keine bestandene Laufzeit- oder Windows-Abnahme.

          ## Exakte Übergaben

          | Paket | PR | Quellcommit |
          |---|---|---|
          '''.replace('          ', '') + rows + '''

          ## Gemeinsame Konfliktkorrekturen

          ARCH-07 übernimmt den zentralen Save-Teilnehmeranschluss. Der von ARCH-22 ergänzte Zukunftsversionsschutz der Tierhaltung sitzt deshalb im registrierten Tribe-Teilnehmer (`save_participants.gd`), nicht im entfernten Sonderzweig des SaveGameService. Der gemeinsame Writer, Originalschutz und die Double-Präzision aus ARCH-06 bleiben erhalten. Alle Testregistrierungen werden additiv und ohne doppelte Zuordnung vereinigt.

          ARCH-14 schützt aktive Tier- und Nahrungszustände über Checkpoint/Regionswechsel. ARCH-24 ergänzt drei Mundmodelle; ARCH-25 ergänzt den DE/EN-Fähigkeitenbereich. Die Eierkette bleibt beim bestehenden D2-Tierbesitzer und der gemeinsamen Dorfwirtschaft. Einzelne Fachprüfungen sind keine gemeinsame Abnahme.

          ## Prüfgrenzen

          Quell-/Importprüfung, echte Kugelvegetation, lange physische Rückreisen, Save-/Neustartketten und native Pakete werden am identischen Integrationsstand geprüft. Bis zum tatsächlich vorliegenden Ergebnis gelten sie hier als offen. Fehlende Vegetation ist bislang eine Nutzerbeobachtung/Testhypothese, kein in dieser Runde reproduzierter Generatorfehler. Es werden keine vorsorglichen Änderungen an Landschaftsseeds oder Tierarten vorgenommen.

          Keine Freigabe für 1080p60 auf Zielhardware. Schiffsflug, weitere Epochen, mehrere spielbare eigene Siedlungen und Online-Community bleiben getrennte Arbeitspakete. Hauptbranch und fremde Arbeitsbranches werden vom Integrationsworkflow nicht verändert.
          '''.replace('          ', '')
          write('docs/INTEGRATION_2026-09-11.md', report)
          manifest = {'schema':1, 'base':BASE, 'sources':[{'pr':n,'sha':s,'package':p} for n,s,p in SOURCES],
                      'status':'source_integrated_validation_pending', 'runtime_checks':[], 'target_pc_acceptance':False}
          write('docs/integration-sources-2026-09-11.json', json.dumps(manifest, indent=2)+'\n')
          note = '''> **Aktueller Integrationsbranch, 11. September 2026:** PR #78–#83 sind auf `agent/integration-sphere-acceptance-2026-09-11` zusammengeführt, noch nicht als gemeinsame Laufzeit-/Ziel-PC-Abnahme freigegeben. ARCH-06-Präzision, ARCH-07-Save-Teilnehmer, ARCH-14-Zustandsschutz, ARCH-22-Eierkette, ARCH-24-Mundmodelle und ARCH-25-Fähigkeiten DE/EN nicht doppelt beginnen. Maßgeblich sind `docs/INTEGRATION_2026-09-11.md` und die exakten Quellcommits. Ältere „nächste Aufgabe“-Zeilen unten sind für diese sechs Lieferungen historisch. Nächster Vorrang: gemeinsame Kugel-/Vegetations-/Rückreiseprüfung, dann verbleibende ARCH-13/14/17/19-Aufträge.\n\n'''
          for path in sorted(CENTRAL):
              content = pathlib.Path(path).read_text(encoding='utf-8')
              if not content.startswith(note):
                  write(path, note+content)
          git('diff','--check')
          git('commit','-m','Document exact six-PR integration and pending shared acceptance')
          print('INTEGRATED_COMMIT',git('rev-parse','HEAD').stdout.strip(),flush=True)
          print('INTEGRATED_TREE',git('rev-parse','HEAD^{tree}').stdout.strip(),flush=True)
          PY
          python tools/check_validation_contracts.py --output "$RUNNER_TEMP/integration-contracts.json"
          git push origin HEAD:refs/heads/agent/integration-sphere-acceptance-2026-09-11
      - name: Install pinned verified Godot toolchain
        run: python tools/install_godot.py --directory "${{ runner.temp }}/integration-toolchain" --platform linux
      - name: Validate merged save, precision, population, egg and presentation contracts
        run: >-
          python tools/validate_godot.py
          --godot "${{ runner.temp }}/integration-toolchain/editor/Godot_v4.6.3-stable_linux.x86_64"
          --output "${{ runner.temp }}/integration-checks"
          --skip-main
          --tests coordinate_persistence_test save_participants_test population_register_test
          egg_production_contract_test creature_mouth_provider_test skills_localization_test
          surface_population_budget_test spherical_creature_test
      - name: Package exact source and offline validation inputs
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/integration-delivery"
          git status --short > "$RUNNER_TEMP/integration-delivery/worktree-status.txt"
          git diff --binary HEAD > "$RUNNER_TEMP/integration-delivery/uncommitted.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/integration-delivery/commit.txt"
          git bundle create "$RUNNER_TEMP/integration-delivery/source.bundle" HEAD
          tar --exclude=.git -czf "$RUNNER_TEMP/integration-delivery/checkout.tar.gz" .
          if [ -d "$RUNNER_TEMP/integration-toolchain/editor" ]; then
            cp "$RUNNER_TEMP/integration-toolchain/editor/Godot_v4.6.3-stable_linux.x86_64" "$RUNNER_TEMP/integration-delivery/godot-linux"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sphere-integration-source-and-checks
          path: |
            ${{ runner.temp }}/integration-delivery
            ${{ runner.temp }}/integration-checks
            ${{ runner.temp }}/integration-contracts.json
          retention-days: 7
