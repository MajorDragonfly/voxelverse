name: Completion dashboard render
on:
  push:
    branches: [agent/completion-render-20261009-d4c5]
permissions:
  contents: read
concurrency:
  group: completion-dashboard-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind actual checkout
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Render and verify original central dashboard
        run: |
          python3 tools/project_dashboard.py render
          python3 tools/project_dashboard.py check
          python3 -m unittest discover -s tests/tooling -p 'project_dashboard_test.py'
          python3 -m unittest discover -s tests/tooling -p 'work_packet_test.py'
      - name: Emit exact generated texts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = ["README.md", "docs/PROJECT_DASHBOARD.md", "docs/dashboard/progress.svg",
                   "docs/PROJECT_STATUS.md", "docs/NEXT_PARALLEL_WORK.md"]
          for name in paths:
              print("VOXELVERSE_GENERATED_FILE_JSON " + json.dumps({"path": name,
                    "content": Path(name).read_text(encoding="utf-8")}, ensure_ascii=True))
          print("VOXELVERSE_GENERATED_FILES_COMPLETE 5")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: completion-dashboard-render
          path: |
            README.md
            tools/workflow/project.json
            docs/PROJECT_DASHBOARD.md
            docs/dashboard/progress.svg
            docs/PROJECT_STATUS.md
            docs/NEXT_PARALLEL_WORK.md
          retention-days: 14
