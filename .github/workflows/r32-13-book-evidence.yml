name: R32-13 focused book evidence
on:
  push:
    branches: [agent/r32-13-evidence-20261002]
permissions:
  contents: read
jobs:
  consumer_trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/install_godot.py --directory /tmp/r32-godot --editor-only
      - run: /tmp/r32-godot/editor/Godot_v4.6.3-stable_linux.x86_64 --headless --import
      - name: Trace unchanged consumer expectations in isolated data
        run: |
          python3 - <<'PY'
          import subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from validation_support import isolated_env
          output=Path('/tmp/r32-consumer-trace')
          output.mkdir()
          with (output/'trace.log').open('w') as log:
              code=subprocess.run(['/tmp/r32-godot/editor/Godot_v4.6.3-stable_linux.x86_64','--headless','--audio-driver','Dummy','--path','.', '--script','res://tools/review_r32_13_consumer_trace.gd'],env=isolated_env(output/'user-data'),stdout=log,stderr=subprocess.STDOUT,timeout=120).returncode
          print((output/'trace.log').read_text())
          sys.exit(code)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r32-13-consumer-trace
          path: /tmp/r32-consumer-trace/trace.log
          retention-days: 14
