name: Environment render validation

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: environment-render-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    # The complete forest review uses CPU Vulkan on hosted runners.
    timeout-minutes: ${{ matrix.review == 'environment' && matrix.renderer == 'forward_plus' && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        renderer: [forward_plus, gl_compatibility]
        review: [planets, environment, spherical_campaign]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot-export-toolchain
          key: godot-4.6.3-desktop-v1-${{ runner.os }}
      - name: Install software renderer and verified Godot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri mesa-vulkan-drivers
          python tools/install_godot.py --directory "${{ runner.temp }}/godot-export-toolchain" --platform linux
      - name: Import project
        run: |
          python tools/validate_godot.py --godot "${{ runner.temp }}/godot-export-toolchain/editor/Godot_v4.6.3-stable_linux.x86_64" --tests environment_production_test --skip-main --output "${{ runner.temp }}/render-import"
      - name: Render underwater optics, voxel planets, orbit and system
        if: matrix.review == 'planets'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          export VK_ICD_FILENAMES="$(python -c 'from pathlib import Path; paths = sorted(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json")); assert len(paths) == 1, paths; print(paths[0])')"
          xvfb-run -a -s '-screen 0 1280x720x24' python tools/profile_environment.py --godot "${{ runner.temp }}/godot-export-toolchain/editor/Godot_v4.6.3-stable_linux.x86_64" --renderer ${{ matrix.renderer }} --output "${{ runner.temp }}/planet-lab-review" --cases underwater planet_lab large_planet galaxy galaxy_visit --seeds 12345 --size 1280 720 --frames 4 --warmup 4 --fast-setup
      - name: Upload M1 review
        if: always() && matrix.review == 'planets'
        uses: actions/upload-artifact@v4
        with:
          name: planet-lab-review-${{ matrix.renderer }}-${{ github.event_name }}
          path: ${{ runner.temp }}/planet-lab-review
          retention-days: 14
      - name: Render shared spherical creature, editor and freshwater flow
        if: matrix.review == 'spherical_campaign'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          export VK_ICD_FILENAMES="$(python -c 'from pathlib import Path; paths = sorted(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json")); assert len(paths) == 1, paths; print(paths[0])')"
          xvfb-run -a -s '-screen 0 1280x720x24' python tools/review_spherical_campaign.py --godot "${{ runner.temp }}/godot-export-toolchain/editor/Godot_v4.6.3-stable_linux.x86_64" --renderer ${{ matrix.renderer }} --output "${{ runner.temp }}/spherical-campaign-review"
      - name: Upload shared spherical campaign captures
        if: always() && matrix.review == 'spherical_campaign'
        uses: actions/upload-artifact@v4
        with:
          name: spherical-campaign-review-${{ matrix.renderer }}-${{ github.event_name }}
          path: ${{ runner.temp }}/spherical-campaign-review
          retention-days: 14
      - name: Render world, assets, Far clusters and creature comparisons
        if: matrix.review == 'environment'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          export VK_ICD_FILENAMES="$(python -c 'from pathlib import Path; paths = sorted(Path("/usr/share/vulkan/icd.d").glob("lvp_icd*.json")); assert len(paths) == 1, paths; print(paths[0])')"
          xvfb-run -a -s '-screen 0 960x540x24' python tools/profile_environment.py --godot "${{ runner.temp }}/godot-export-toolchain/editor/Godot_v4.6.3-stable_linux.x86_64" --renderer ${{ matrix.renderer }} --output "${{ runner.temp }}/environment-review" --size 960 540 --frames 4 --warmup 4 --fast-setup
      - name: Upload rendered review and measurements
        if: always() && matrix.review == 'environment'
        uses: actions/upload-artifact@v4
        with:
          name: environment-review-${{ matrix.renderer }}-${{ github.event_name }}
          path: |
            ${{ runner.temp }}/environment-review
            ${{ runner.temp }}/render-import
            ${{ runner.temp }}/planet-lab-review
          retention-days: 14
