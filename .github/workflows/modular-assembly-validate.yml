name: Modular assembly validation

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

jobs:
  assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          "$GODOT" --headless --path . --import 2>&1 | tee /tmp/assembly-import.log
          ! grep -E \
            "SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Shader compilation failed" \
            /tmp/assembly-import.log

      - name: Run Modular Assembly Framework test
        shell: bash
        run: |
          set +e
          GODOT=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          timeout 60s "$GODOT" --headless --path . \
            --script res://tests/modular_assembly_framework_test.gd \
            > /tmp/modular-assembly-test.log 2>&1
          TEST_STATUS=$?
          if [ "$TEST_STATUS" -eq 124 ]; then
            echo "Modular Assembly Framework test timed out." >> /tmp/modular-assembly-test.log
            TEST_STATUS=1
          fi
          if grep -E \
            "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Failed to load script|Failed loading resource" \
            /tmp/modular-assembly-test.log; then
            TEST_STATUS=1
          fi
          cat /tmp/modular-assembly-test.log
          exit "$TEST_STATUS"

      - name: Run authored Asset Pipeline test
        shell: bash
        run: |
          set +e
          GODOT=/tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          timeout 45s "$GODOT" --headless --path . \
            --script res://tests/asset_pipeline_test.gd \
            > /tmp/asset-pipeline-test.log 2>&1
          TEST_STATUS=$?
          if [ "$TEST_STATUS" -eq 124 ]; then
            echo "Asset Pipeline test timed out." >> /tmp/asset-pipeline-test.log
            TEST_STATUS=1
          fi
          if grep -E \
            "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|Failed to load script|Failed loading resource" \
            /tmp/asset-pipeline-test.log; then
            TEST_STATUS=1
          fi
          cat /tmp/asset-pipeline-test.log
          exit "$TEST_STATUS"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-assembly-diagnostics
          path: |
            /tmp/assembly-import.log
            /tmp/modular-assembly-test.log
            /tmp/asset-pipeline-test.log
          if-no-files-found: warn
          retention-days: 3
