name: R33-04 camera diagnosis (opt-in)
on:
  pull_request:
    paths:
      - '.github/workflows/r33-04-camera-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r33-04-camera-${{ github.ref }}
  cancel-in-progress: true
jobs:
  camera:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-godot-editor
        id: engine
      - name: Exact original world route with unchanged point assertion and collider identity
        run: |
          hostname
          git rev-parse HEAD HEAD^{tree}
          flock -n /tmp/voxelverse-heavy.lock flock -n /tmp/voxelverse-r32-db514e109ac6-heavy.lock \
            python3 tools/validate_godot.py --godot '${{ steps.engine.outputs.godot }}' \
            --tests tribal_camera_world_test --skip-main --output "$RUNNER_TEMP/r33-04/overlap"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r33-04-overlap-diagnosis
          path: ${{ runner.temp }}/r33-04
          retention-days: 14
