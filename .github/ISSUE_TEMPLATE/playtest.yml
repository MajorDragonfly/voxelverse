name: 'Spieletest: Fehler oder Verbesserung'
description: Einen beobachteten Fehler oder eine konkrete Verbesserung nachvollziehbar erfassen.
title: '[BUG][ROLLE] Kurzer beobachtbarer Befund'
body:
- type: markdown
  attributes:
    value: |-
      Pro unabhängig behebbarem Befund ein Issue. Titel an Typ und Rollen-ID anpassen, z. B. `[BUG][03-KI] Gefährte bleibt stehen`.
      Mehrere Befunde optional in einem `[SPIELTEST]`-Sammelissue verlinken. Vorhandene passende Issues ergänzen.
      Unbekannte Fakten als `unbekannt` angeben. Vergabe: [zentrale Runde #137](https://github.com/MajorDragonfly/voxelverse/issues/137).
- type: input
  id: capture_id
  attributes:
    label: Erfassungskennung
    description: Kennung bei Ergänzungen und erneuten Übertragungen desselben Eintrags beibehalten.
    placeholder: PT-20260917-SITZUNG-01
  validations:
    required: true
- type: dropdown
  id: finding_type
  attributes:
    label: Typ
    options:
    - BUG
    - VERBESSERUNG
  validations:
    required: true
- type: dropdown
  id: main_role
  attributes:
    label: Vorgeschlagene Hauptrolle
    description: Eine fachliche Zuständigkeit wählen. Das ist keine Reservierung und kein GitHub-Assignee.
    options:
    - 01 Projektleitung & Integration
    - 02 Gameplay & Fortschritt
    - 03 Kreaturen-KI & Sozialverhalten
    - 04 UI/UX & Tutorials
    - 05 Kreaturendesign & Animation
    - 06 Welt, Grafik & Effekte
    - 07 Musik & Sound
    - 08 Technik, Performance & Werkzeuge
    - 09 Spieletest & Fehleraufnahme
    - 10 Roadmap & Ideen
    - 11 Qualitätssicherung & Releases
  validations:
    required: true
- type: textarea
  id: source
  attributes:
    label: Quelle und Spielstand
    description: Build/Commit nur übernehmen, wenn belegt. Seed, Spielstand und Hardware ergänzen, soweit für den
      Befund relevant.
    value: |-
      Aufnahmestatus: erfasst
      Quelle / Testdatum: unbekannt
      Build-ID / Commit-SHA: unbekannt
      Epoche: unbekannt
      Seed / Planet / Spielstand: unbekannt
      Betriebssystem / Hardware / Grafikeinstellungen: unbekannt
  validations:
    required: true
- type: textarea
  id: finding
  attributes:
    label: Beobachtung, Erwartung und Reproduktion
    description: Beschreiben, was tatsächlich zu sehen ist, was erwartet wird und wie häufig es auftritt. Keine
      vermutete Ursache als Tatsache angeben.
    value: |
      Beobachtung:

      Erwartetes Verhalten:

      Schritte zur Reproduktion:
      1. ...

      Häufigkeit: unbekannt
      Auswirkung auf das Spielen:
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Belege
    description: Dauerhafte Bild-/Video-/Loglinks mit Zeitmarken. Fehlt ein zugänglicher Anhang, dessen Inhalt beschreiben
      und die Lücke markieren.
    placeholder: |-
      Beleg: https://...
      Zeitmarke: ...
      Sichtbarer Inhalt: ...
      Noch nicht zugängliche Anhänge: ...
- type: textarea
  id: hypothesis
  attributes:
    label: Ursachenvermutung (optional)
    description: Nur als Hypothese formulieren; von Beobachtung und Belegen getrennt halten.
- type: dropdown
  id: priority
  attributes:
    label: Prioritätsvorschlag
    description: Nach Auswirkung vorschlagen; die Begründung gehört in den Befund bzw. Spielnutzen.
    options:
    - P0 – Datenverlust oder regulärer Spielweg blockiert
    - P1 – Kernspiel stark beeinträchtigt / häufiger Absturz
    - P2 – Relevante Bedienungs-, Darstellungs- oder Gameplayverbesserung
    - P3 – Feinschliff oder spätere Option
    - Ungeklärt
- type: textarea
  id: acceptance
  attributes:
    label: Überprüfbare Abnahme
    description: Woran erkennt ein Nachtest den Erfolg? Falls noch offen, als ungeklärt markieren. Erforderlichen
      Nachtest durch Lars nennen.
    placeholder: |-
      - [ ] Bei denselben Schritten passiert ...
      - [ ] ...
      Nachtest durch Lars erforderlich: ungeklärt
  validations:
    required: true
- type: textarea
  id: references
  attributes:
    label: Duplikatprüfung, Verweise und Übergabe
    description: Offene/geschlossene Issues und PRs prüfen. Treffer und Abhängigkeiten verlinken; fehlende Prüfung
      ausdrücklich kennzeichnen.
    value: |-
      Duplikatprüfung: ungeprüft
      Verwandte Issues/PRs: unbekannt
      Abhängigkeiten / beteiligte Rollen: unbekannt
      Nächste Zuständigkeit / benötigter Schritt: unbekannt
