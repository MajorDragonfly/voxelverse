name: Idee und Roadmap-Vorschlag
description: Spielnutzen, Umfang und Entscheidung einer neuen Idee dokumentieren, ohne eine v1-Zusage vorwegzunehmen.
title: '[IDEE][ROLLE] Konkreter Spielnutzen'
body:
- type: markdown
  attributes:
    value: |-
      Titel um die fachliche Rollen-ID ergänzen, z. B. `[IDEE][02-GAMEPLAY] ...`. Vorher Roadmap und offene/geschlossene Issues auf Überschneidungen prüfen.
      Eine Idee ist zunächst ein Vorschlag. Ein ausdrücklicher Nutzerauftrag gilt bereits als Entscheidung; Quelle dokumentieren.
      Aufnahme erweitert v1 nicht automatisch. Koordination bewertet Abhängigkeiten und den verbindlichen Zielumfang.
- type: input
  id: capture_id
  attributes:
    label: Erfassungskennung
    description: Kennung bei Ergänzungen und erneuten Übertragungen desselben Eintrags beibehalten.
    placeholder: IDEA-20260917-SITZUNG-01
  validations:
    required: true
- type: dropdown
  id: main_role
  attributes:
    label: Vorgeschlagene Hauptrolle
    description: Eine fachliche Zuständigkeit wählen. Das ist keine Reservierung und kein GitHub-Assignee.
    options:
    - 01 Projektleitung & Integration
    - 02 Gameplay & Fortschritt
    - 03 Kreaturen-KI & Sozialverhalten
    - 04 UI/UX & Tutorials
    - 05 Kreaturendesign & Animation
    - 06 Welt, Grafik & Effekte
    - 07 Musik & Sound
    - 08 Technik, Performance & Werkzeuge
    - 09 Spieletest & Fehleraufnahme
    - 10 Roadmap & Ideen
    - 11 Qualitätssicherung & Releases
  validations:
    required: true
- type: textarea
  id: source
  attributes:
    label: Quelle, Epoche und Kontext
    description: Anlass und Datum nennen; Build/Seed nur bei einem konkreten Testbezug ergänzen. Unbekannte Fakten
      offenlassen.
    value: |-
      Aufnahmestatus: erfasst
      Typ: IDEE
      Quelle / Datum: unbekannt
      Passende Epoche(n): unbekannt
      Build / Seed bei Testbezug: unbekannt
  validations:
    required: true
- type: textarea
  id: benefit
  attributes:
    label: Idee und Spielnutzen
    description: Welches Spielerlebnis verbessert sich? Ausgangslage, gewünschtes Verhalten und Auswirkung konkret
      beschreiben.
    value: |
      Ausgangslage / Bedarf:

      Idee / gewünschtes Spielerlebnis:

      Spielnutzen / Auswirkung:
  validations:
    required: true
- type: dropdown
  id: decision
  attributes:
    label: Entscheidungsstand
    description: Eigene Bewertung ist keine Nutzerentscheidung. Bei einem vorhandenen Auftrag nicht erneut dieselbe
      Freigabe verlangen.
    options:
    - Vorschlag – noch keine Umsetzungsentscheidung
    - Angenommen – ausdrücklicher Nutzerauftrag liegt vor
    - Zurückgestellt – dokumentierte Entscheidung liegt vor
    - Abgelehnt – dokumentierte Entscheidung liegt vor
  validations:
    required: true
- type: textarea
  id: decision_source
  attributes:
    label: Beleg zur Entscheidung
    description: Bei einer Entscheidung Quelle, Datum und beauftragten Umfang angeben. Ohne Beleg bleibt sie ein
      Vorschlag.
    placeholder: |-
      Quelle / Datum: ...
      Entscheidung von Lars / beauftragter Umfang: ...
- type: textarea
  id: scope
  attributes:
    label: Kleinste sinnvolle Umsetzung
    description: Einen nutzbaren ersten Schritt, Umfangsgrenzen und groben Aufwand (klein/mittel/groß/ungeklärt)
      beschreiben. Keine v1-Zusage ableiten.
    value: |-
      Erster sinnvoller Umfang:

      Spätere Ausbaustufen / außerhalb dieses Vorschlags:

      Aufwand: ungeklärt
  validations:
    required: true
- type: dropdown
  id: priority
  attributes:
    label: Prioritätsvorschlag
    description: Nach Auswirkung vorschlagen; die Begründung gehört in den Befund bzw. Spielnutzen.
    options:
    - P0 – Datenverlust oder regulärer Spielweg blockiert
    - P1 – Kernspiel stark beeinträchtigt / häufiger Absturz
    - P2 – Relevante Bedienungs-, Darstellungs- oder Gameplayverbesserung
    - P3 – Feinschliff oder spätere Option
    - Ungeklärt
- type: textarea
  id: acceptance
  attributes:
    label: Abnahme und Roadmap-Anschluss
    description: Beobachtbares Erfolgskriterium, passende Roadmap-Stelle und offene Entscheidungen nennen; keine
      Umsetzung oder Fortschrittsprozente behaupten.
    placeholder: |-
      Erfolgskriterium: ...
      Roadmap-Stelle / Vorschlag zur Einordnung: ...
      Offene Entscheidungen: ...
- type: textarea
  id: references
  attributes:
    label: Duplikatprüfung, Verweise und Übergabe
    description: Offene/geschlossene Issues und PRs prüfen. Treffer und Abhängigkeiten verlinken; fehlende Prüfung
      ausdrücklich kennzeichnen.
    value: |-
      Duplikatprüfung: ungeprüft
      Verwandte Issues/PRs: unbekannt
      Abhängigkeiten / beteiligte Rollen: unbekannt
      Nächste Zuständigkeit / benötigter Schritt: unbekannt
